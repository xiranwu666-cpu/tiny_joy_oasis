app = "oasis-digital-sanctuary"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data/app_data.sqlite"
  PORT = "8000"

[[mounts]]
  source = "oasis_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
