        .card-tag {
            display: inline-block;
            font-size: 12px;
            background: #FFF1F2;
            color: #FDA4AF;
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 25px;
            letter-spacing: 2px;

        p.desc {
            font-size: 15px;
            line-height: 1.8;
            color: #64748b;
            margin: 0 0 35px 0;
        }

        .sound-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 30px; }
        .sound-item {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(226, 232, 240, 0.6);
            padding: 18px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 14px;
        }
        .sound-item.playing {
            background: #FFFBEB;
            border-color: #FCD34D;
        }

        .vent-input {
            width: 100%; height: 110px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 14px; padding: 15px; box-sizing: border-box;
            font-size: 14px; color: #475569; resize: none; margin-bottom: 25px; outline: none;
        }

        /* Optimized Stress-Relief Release State */
        .vent-input.becoming-bubble {
            display: block !important;
            border-radius: 50% !important;
            width: 100px !important;
            height: 100px !important;
            padding: 0 !important;
            color: transparent !important; /* Instantly hide text */
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9) 0%, rgba(250, 208, 196, 0.4) 50%, rgba(230, 240, 250, 0.6) 100%) !important;
            border: 2px solid rgba(254, 225, 128, 0.6) !important;
            box-shadow: 0 20px 40px rgba(148, 163, 184, 0.15), 
                        inset -10px -10px 25px rgba(230, 240, 250, 0.5), 
                        inset 10px 10px 25px rgba(255, 255, 255, 0.8) !important;
            margin: 0 auto 25px auto !important;
            pointer-events: none;
            
            animation: gentleSinkRelease 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes gentleSinkRelease {
            0% {
                transform: scale(1) translateY(0) rotate(0deg);
            }
            15% {
                transform: scaleX(1.08) scaleY(0.92) translateY(8px) rotate(-2deg);
            }
            40% {
                transform: scaleX(0.96) scaleY(1.06) translateX(10px) translateY(28px) rotate(3deg);
                opacity: 1;
            }
            70% {
                transform: scaleX(1.02) scaleY(0.98) translateX(-8px) translateY(48px) rotate(-2deg);
                opacity: 0.58;
            }
            100% {
                transform: scale(0.72) translateY(72px);
                opacity: 0;
            }
        }

        function byId(id) {
            return document.getElementById(id);
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, function(char) {
                return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char];
            });
        }

        function randomItem(items) {
            return items[Math.floor(Math.random() * items.length)];
        }

        function quoteText(text) {
            return state.lang === "en" ? "“" + text + "”" : "“" + text + "”";
        }

        function todayKey() {
            var now = new Date();
            var month = String(now.getMonth() + 1).padStart(2, "0");
            var day = String(now.getDate()).padStart(2, "0");
            return now.getFullYear() + "-" + month + "-" + day;
        }

        function recordLocalVisit() {
            try {
                var key = "oasis.visitDays";
                var today = todayKey();
                var stored = JSON.parse(window.localStorage.getItem(key) || "[]");
                var days = Array.isArray(stored) ? stored.filter(function(item) {
                    return typeof item === "string";
                }) : [];
                var alreadyToday = days.indexOf(today) !== -1;
                if (!alreadyToday) {
                    days.push(today);
                    days = Array.from(new Set(days)).slice(-180);
                    window.localStorage.setItem(key, JSON.stringify(days));
                }
                visitState = {
                    count: days.length,
                    alreadyToday: alreadyToday
                };
            } catch (error) {
                visitState = null;
            }
        }

        function updateVisitNote() {
            var note = byId("visit-note");
            if (!note) {
                return;
            }
            if (!visitState) {
                note.innerText = copy[state.lang].visit.todayPause;
                return;
            }
            var visit = copy[state.lang].visit;
            if (visitState.alreadyToday) {
                note.innerText = visit.todayAgain;
                return;
            }
            if (visitState.count <= 1) {
                note.innerText = visit.first;
                return;
            }
            note.innerText = visit.returning.replace("{count}", visitState.count);
        }

        function getOrigin() {
            return window.location.origin || "";

        function getSeoOrigin() {
            return SITE_ORIGIN && SITE_ORIGIN.indexOf("__") === -1 ? SITE_ORIGIN : getOrigin();
        }

        function publicRoute(page) {
            return PUBLIC_ROUTES[page] || "today";
        }

        function validGuideSlug(slug) {
            return GUIDE_SLUGS.indexOf(slug) !== -1 ? slug : "";
        }

        function isStaticPreview() {
            return window.location.protocol === "file:" || /\/oasis\/index\.html$/.test(window.location.pathname);
        }

        function guideUrl(lang, slug) {
            var query = preservedSearch();
            if (isStaticPreview()) {
                var params = new URLSearchParams(query ? query.slice(1) : "");
                params.set("lang", lang);
                params.set("guide", slug);
                return "/oasis/index.html?" + params.toString();
            }
            return "/oasis/" + lang + "/guide/" + slug + query;
        }

        function preservedSearch() {
            var source = new URLSearchParams(window.location.search);
            var kept = new URLSearchParams();
            source.forEach(function(value, key) {
                if (key.indexOf("utm_") === 0 || ["gclid", "fbclid", "msclkid"].indexOf(key) !== -1) {
                    kept.set(key, value);
                }
            });
            var query = kept.toString();
            return query ? "?" + query : "";
        }

        function routeUrl(lang, page) {
            return "/oasis/" + lang + "/" + publicRoute(page) + preservedSearch();
        }

        function readInitialState() {
            var params = new URLSearchParams(window.location.search);
            var pathParts = window.location.pathname.split("/").filter(Boolean);
            var pathLang = pathParts[1];
            var pathRoute = pathParts[2];
            var pathGuideSlug = pathRoute === "guide" ? pathParts[3] : "";
            var queryLang = params.get("lang");
            var queryPage = parseInt(params.get("page") || "", 10);
            state.lang = VALID_LANGS[queryLang] ? queryLang : (VALID_LANGS[pathLang] ? pathLang : "zh");
            state.guideSlug = validGuideSlug(params.get("guide") || pathGuideSlug);
            state.page = state.guideSlug ? 1 : (PAGE_BY_ROUTE[pathRoute] || (PAGE_BY_ROUTE[params.get("route")] || (ROUTES[queryPage] ? queryPage : 1)));

        function trackPageView() {
            var route = state.guideSlug ? "guide" : ROUTES[state.page];
            var path = window.location.pathname + window.location.search;
            var dedupeKey = state.lang + "|" + route + "|" + (state.guideSlug || "") + "|" + path;
            if (dedupeKey === lastTrackedPageView) {
                return;
            }
            lastTrackedPageView = dedupeKey;
            var payload = {
                lang: state.lang,
                route: route,
                path: path,
                guideSlug: state.guideSlug || "",
                referrer: document.referrer || "",
                title: document.title
            };
            fetch("/api/oasis/analytics/pageview", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
                keepalive: true
            }).catch(function() {});
            trackGaPageView(route, path);
        }

        function trackGaPageView(route, path) {
            if (!window.oasisAnalyticsReady || typeof window.gtag !== "function") {
                return;
            }
            window.gtag("event", "page_view", {
                page_title: document.title,
                page_location: window.location.origin + path,
                page_path: path,
                oasis_lang: state.lang,
                oasis_route: route
            });
        }

        function trackGaEvent(eventName, params) {
            if (!window.oasisAnalyticsReady || typeof window.oasisTrack !== "function") {
                return;

            window.oasisTrack(eventName, Object.assign({
                oasis_lang: state.lang,
                oasis_route: state.guideSlug ? "guide" : ROUTES[state.page],
                guide_slug: state.guideSlug || undefined

        function roundRectPath(context, x, y, width, height, radius) {
            context.beginPath();
            context.moveTo(x + radius, y);
            context.lineTo(x + width - radius, y);
            context.quadraticCurveTo(x + width, y, x + width, y + radius);
            context.lineTo(x + width, y + height - radius);
            context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            context.lineTo(x + radius, y + height);
            context.quadraticCurveTo(x, y + height, x, y + height - radius);
            context.lineTo(x, y + radius);
            context.quadraticCurveTo(x, y, x + radius, y);
            context.closePath();
        }

        function drawWrappedText(context, text, x, y, maxWidth, lineHeight, maxLines) {
            var chars = Array.from(String(text));
            var lines = [];
            var line = "";
            chars.forEach(function(char) {
                var test = line + char;
                if (context.measureText(test).width > maxWidth && line) {
                    lines.push(line);
                    line = char;
                } else {
                    line = test;
                }
            });
            if (line) lines.push(line);
            if (lines.length > maxLines) {
                lines = lines.slice(0, maxLines);
                while (context.measureText(lines[lines.length - 1] + "...").width > maxWidth && lines[lines.length - 1].length > 1) {
                    lines[lines.length - 1] = lines[lines.length - 1].slice(0, -1);
                }
                lines[lines.length - 1] += "...";
            }
            lines.forEach(function(item, index) {
                context.fillText(item, x, y + index * lineHeight);
            });
            return y + lines.length * lineHeight;
        }

        function drawCenteredWrappedText(context, text, centerX, y, maxWidth, lineHeight, maxLines) {
            var chars = Array.from(String(text));
            var lines = [];
            var line = "";
            chars.forEach(function(char) {
                var test = line + char;
                if (context.measureText(test).width > maxWidth && line) {
                    lines.push(line);
                    line = char;
                } else {
                    line = test;
                }
            });
            if (line) lines.push(line);
            if (lines.length > maxLines) {
                lines = lines.slice(0, maxLines);
                while (context.measureText(lines[lines.length - 1] + "...").width > maxWidth && lines[lines.length - 1].length > 1) {
                    lines[lines.length - 1] = lines[lines.length - 1].slice(0, -1);
                }
                lines[lines.length - 1] += "...";
            }
            lines.forEach(function(item, index) {
                context.fillText(item, centerX - context.measureText(item).width / 2, y + index * lineHeight);
            });
            return y + lines.length * lineHeight;
        }

        function drawWatercolorWash(context, x, y, width, height, color, alpha, rotation) {
            var petals = [
                [-0.32, -0.18, 0.58, 0.36],

                [0.26, -0.1, 0.52, 0.34],

                [-0.22, 0.18, 0.56, 0.38],
                [0.02, 0.02, 0.82, 0.5]
            ];
            context.save();
            context.translate(x, y);
            context.rotate((rotation || 0) * Math.PI / 180);
            context.globalAlpha = alpha;
            context.filter = "blur(20px)";
            petals.forEach(function(petal) {
                context.fillStyle = color;
                context.beginPath();
                context.ellipse(petal[0] * width, petal[1] * height, petal[2] * width, petal[3] * height, 0, 0, Math.PI * 2);
                context.fill();

            context.filter = "none";

        }

        function drawPaperGrain(context, width, height) {

            for (var i = 0; i < 260; i += 1) {
                var x = (i * 73) % width;

        function drawSoftStar(context, x, y, size, color) {

        function drawQrCode(context, url, x, y, size) {
            if (typeof qrcode !== "function") {
                context.fillStyle = "#ffffff";
                roundRectPath(context, x, y, size, size, 22);
                context.fill();
                context.fillStyle = "#475569";
                context.font = "18px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
                drawWrappedText(context, url, x + 18, y + 46, size - 36, 26, 5);
                return;
            }
            var qr = qrcode(0, "M");
            qr.addData(url);
            qr.make();
            var count = qr.getModuleCount();
            var padding = 18;
            var cell = Math.floor((size - padding * 2) / count);
            var qrSize = cell * count;
            var offset = Math.floor((size - qrSize) / 2);
            context.fillStyle = "#ffffff";
            roundRectPath(context, x, y, size, size, 22);
            context.fill();
            context.fillStyle = "#1e293b";
            for (var row = 0; row < count; row += 1) {
                for (var col = 0; col < count; col += 1) {
                    if (qr.isDark(row, col)) {
                        context.fillRect(x + offset + col * cell, y + offset + row * cell, cell, cell);
                    }
                }
            }
        }

        function ensureQrLibrary() {
            if (typeof qrcode === "function") {
                return Promise.resolve(true);
            }
            return new Promise(function(resolve) {
                var existing = document.querySelector('script[data-oasis-qr="true"]');
                if (existing) {
                    existing.addEventListener("load", function() { resolve(typeof qrcode === "function"); }, { once: true });
                    existing.addEventListener("error", function() { resolve(false); }, { once: true });
                    window.setTimeout(function() { resolve(typeof qrcode === "function"); }, 1800);
                    return;
                }
                var script = document.createElement("script");
                script.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js";
                script.async = true;
                script.dataset.oasisQr = "true";
                script.onload = function() { resolve(typeof qrcode === "function"); };
                script.onerror = function() { resolve(false); };
                document.head.appendChild(script);
                window.setTimeout(function() { resolve(typeof qrcode === "function"); }, 2200);
            });
        }

        function dataUrlToBlob(dataUrl) {
            var parts = dataUrl.split(",");
            var mime = (parts[0].match(/:(.*?);/) || [])[1] || "image/png";
            var binary = atob(parts[1]);
            var length = binary.length;
            var bytes = new Uint8Array(length);
            for (var i = 0; i < length; i += 1) {
                bytes[i] = binary.charCodeAt(i);
            }
            return new Blob([bytes], { type: mime });
        }

            link.remove();
            return true;
        }

        function savePoster(event) {
            if (event) popParticles(event);
            if (!downloadPosterFile()) {
                return;
            }
            updatePosterStatus(copy[state.lang].share.posterSaved);
            trackGaEvent("poster_download", { poster_kind: lastPosterKind || "unknown" });
        }

        function isMobileLike() {
            return /Android|iPhone|iPad|iPod|Mobile|MicroMessenger/i.test(navigator.userAgent || "");
        }

        function tryOpenApp(appUrl, webUrl) {
            var didLeave = false;
            function markLeave() {
                if (document.hidden) didLeave = true;
            }
            document.addEventListener("visibilitychange", markLeave, { once: true });
            if (appUrl) {
                window.location.href = appUrl;
            }
            if (webUrl) {
                window.setTimeout(function() {
                    document.removeEventListener("visibilitychange", markLeave);
                    if (!didLeave) {
                        window.open(webUrl, "_blank", "noopener,noreferrer");
                    }
                }, 900);
            }
        }

        function safeNavigateShareWindow(preparedWindow, url) {
            if (preparedWindow && !preparedWindow.closed) {
                try {
                    preparedWindow.location.href = url;
                    return true;
                } catch (error) {}
            }
            window.open(url, "_blank", "noopener,noreferrer");
            return false;
        }

        async function sharePosterNative() {
            if (!lastPosterSource || !lastPosterDataUrl) {
                updatePosterStatus(copy[state.lang].share.posterMissing);
                return false;
            }
            var payload = posterSharePayload(lastPosterSource, lastPosterKind);
            if (navigator.share) {
                try {
                    if (lastPosterFile && navigator.canShare && navigator.canShare({ files: [lastPosterFile] })) {
                        await navigator.share({ files: [lastPosterFile], title: "OASIS", text: payload });
                    } else {
                        await navigator.share({ title: "OASIS", text: payload, url: posterPageUrl(lastPosterKind) });
                    }
                    updatePosterStatus(copy[state.lang].share.nativeReady);
                    trackGaEvent("poster_share", { poster_kind: lastPosterKind || "unknown", platform: "native" });
                    return true;
                } catch (error) {
                    return false;
                }
            }
            return false;
        }

        async function sharePosterSocial(platform, event) {
            if (event) popParticles(event);
            if (!lastPosterSource || !lastPosterDataUrl) {
                updatePosterStatus(copy[state.lang].share.posterMissing);
                return;
            }
            var share = copy[state.lang].share;
            var payload = posterSharePayload(lastPosterSource, lastPosterKind);
            var url = posterPageUrl(lastPosterKind);
            var instagramCreateUrl = "https://www.instagram.com/create/select/";
            var preparedInstagramWindow = null;
            if (platform === "instagram" && !isMobileLike() && !(event && event.currentTarget && event.currentTarget.tagName === "A")) {
                preparedInstagramWindow = window.open("about:blank", "_blank");
            }
            if (platform === "weibo") {
                window.open("https://service.weibo.com/share/share.php?url=" + encodeURIComponent(url) + "&title=" + encodeURIComponent(payload), "_blank", "noopener,noreferrer");
                updatePosterStatus(share.weiboReady);
                trackGaEvent("poster_share", { poster_kind: lastPosterKind || "unknown", platform: "weibo" });
                return;
            }
            if (platform === "instagram") {
                if (event && event.preventDefault) {
                    event.preventDefault();
                }
                if (isMobileLike()) {
                    var sharedToSystem = await sharePosterNative();
                    if (sharedToSystem) {
                        if (preparedInstagramWindow && !preparedInstagramWindow.closed) {
                            preparedInstagramWindow.close();
                        }
                        trackGaEvent("poster_share", { poster_kind: lastPosterKind || "unknown", platform: "instagram_native" });
                        return;
                    }
                }
                await copyTextToClipboard(payload);
                downloadPosterFile();
                updatePosterStatus(share.instagramReady);
                if (isMobileLike()) {
                    tryOpenApp("instagram://camera", instagramCreateUrl);
                } else if (preparedInstagramWindow) {
                    safeNavigateShareWindow(preparedInstagramWindow, instagramCreateUrl);
                } else {
                    window.setTimeout(function() {
                        window.location.href = instagramCreateUrl;
                    }, 180);
                }
                trackGaEvent("poster_share", { poster_kind: lastPosterKind || "unknown", platform: "instagram" });
                return;
            } else if (platform === "wechat") {
                await copyTextToClipboard(payload);
                downloadPosterFile();
                tryOpenApp("weixin://dl/chat", "https://weixin.qq.com/");
                updatePosterStatus(share.wechatReady);
                trackGaEvent("poster_share", { poster_kind: lastPosterKind || "unknown", platform: "wechat" });
                return;
            }
            var usedNativeShare = await sharePosterNative();
            if (!usedNativeShare) {
                await copyTextToClipboard(payload);
                updatePosterStatus(share.nativeFallback);
            }
            trackGaEvent("poster_share_fallback", { poster_kind: lastPosterKind || "unknown", platform: platform });
        }

        function ensureAudioTags() {
            var host = byId("audio-host");
            if (!host) {
                return;
            }
            soundKeys.forEach(function(soundKey) {
                getAudioInstance(soundKey);
            });
        }

        function getAudioInstance(soundKey) {
            if (!soundSources[soundKey]) {
                return null;
            }
            if (audioInstances[soundKey]) {
                return audioInstances[soundKey];
            }
            var audio = document.createElement("audio");
            audio.id = "oasis-audio-" + soundKey;
            audio.loop = true;
            audio.preload = "auto";
            audio.src = soundSources[soundKey];
            audio.volume = 0.42;
            audioInstances[soundKey] = audio;
            var host = byId("audio-host");
            if (host) {
                host.appendChild(audio);
            }
            return audio;
        }

        function soundKey(event, soundKey, element) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggleSound(soundKey, element);
            }
        }

        function toggleSound(soundKey, element) {
            var page = copy[state.lang].pages[2];
            var audio = getAudioInstance(soundKey);
            var status = byId("sound-status");
            if (!audio) {
                return;
            }
            if (!audio.paused || fallbackAudioInstances[soundKey]) {
                stopSound(soundKey);
                updateSoundStatus(page);
                return;
            }
            element.classList.add("playing");
            if (status) status.innerText = page.playing;
            trackGaEvent("sound_play", { sound_key: soundKey });
            primeFallbackAudioContext();
            audio.play().catch(function() {
                startFallbackSound(soundKey);
                if (status) status.innerText = page.playing;
            });
        }

        function updateSoundStatus(page) {
            var playingCount = document.querySelectorAll(".sound-item.playing").length;
            var status = byId("sound-status");
            if (!status) {
                return;
            }
            status.innerText = playingCount > 0 ? page.playing : page.ready;
        }

        function stopSound(soundKey) {
            var audio = audioInstances[soundKey];
            if (audio) {
                audio.pause();
                audio.currentTime = 0;
            }
            if (fallbackAudioInstances[soundKey]) {
                fallbackAudioInstances[soundKey].stop();
                delete fallbackAudioInstances[soundKey];
            }
            var item = byId("sound-" + soundKey);
            if (item) {
                item.classList.remove("playing");
            }
        }

        function stopAllAudio() {
            soundKeys.forEach(function(soundKey) {
                stopSound(soundKey);
            });
        }

        function primeFallbackAudioContext() {
            var AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) {
                return null;
            }
            if (!fallbackAudioContext) {
                fallbackAudioContext = new AudioContextClass();
            }
            if (fallbackAudioContext.state === "suspended" && fallbackAudioContext.resume) {
                fallbackAudioContext.resume();
            }
            return fallbackAudioContext;
        }

        function startFallbackSound(soundKey) {
            if (fallbackAudioInstances[soundKey]) {
                return;
            }
            var context = primeFallbackAudioContext();
            if (!context) {
                return;
            }
            var gain = context.createGain();
            gain.gain.value = soundKey === "cat" ? 0.035 : 0.05;
            gain.connect(context.destination);
            var nodes = [];
            if (soundKey === "cat") {
                [72, 86].forEach(function(frequency) {
                    var oscillator = context.createOscillator();
                    oscillator.type = "sine";
                    oscillator.frequency.value = frequency;
                    oscillator.connect(gain);
                    oscillator.start();
                    nodes.push(oscillator);
                });
            } else {
                var duration = 2;
                var buffer = context.createBuffer(1, context.sampleRate * duration, context.sampleRate);
                var data = buffer.getChannelData(0);
                for (var index = 0; index < data.length; index += 1) {
                    var noise = Math.random() * 2 - 1;
                    if (soundKey === "fire") data[index] = noise * (Math.random() > 0.986 ? 0.95 : 0.045);
                    if (soundKey === "rain") data[index] = noise * 0.16;
                    if (soundKey === "leaves") data[index] = noise * (Math.random() > 0.92 ? 0.18 : 0.035);
                }
                var source = context.createBufferSource();
                source.buffer = buffer;
                source.loop = true;
                var filter = context.createBiquadFilter();
                filter.type = soundKey === "rain" ? "lowpass" : "bandpass";
                filter.frequency.value = soundKey === "rain" ? 1200 : soundKey === "fire" ? 650 : 1900;
                source.connect(filter);
                filter.connect(gain);
                source.start();
                nodes.push(source);
                nodes.push(filter);
            }
            fallbackAudioInstances[soundKey] = {
                stop: function() {
                    nodes.forEach(function(node) {
                        try {
                            if (node.stop) node.stop();
                            if (node.disconnect) node.disconnect();
                        } catch (error) {}
                    });
                    try { gain.disconnect(); } catch (error) {}
                }
            };
        }

        function toggleBreathing() {
            if (breatheAnimation) {
                stopBreathing();
            } else {
                startBreathing();
            }
        }

        function startBreathing() {
            var page = copy[state.lang].pages[2];
            var wrap = byId("breathe-wrap");
            var circle = byId("breathe-circle");
            var label = byId("breathe-label");
            var button = byId("breathe-btn");
            if (!wrap || !circle || !label || !button) {
                return;
            }
            trackGaEvent("breathe_start");
            wrap.style.display = "flex";
            button.innerText = page.stop;
            breatheAnimation = circle.animate([
                { transform: "scale(0.72)", opacity: 0.44, offset: 0 },
                { transform: "scale(1.48)", opacity: 0.72, offset: 0.21 },
                { transform: "scale(1.48)", opacity: 0.66, offset: 0.58 },
                { transform: "scale(0.72)", opacity: 0.44, offset: 1 }
            ], { duration: 19000, iterations: Infinity, easing: "ease-in-out" });
            var phase = 0;
            label.innerText = page.phases[phase];
            breathePhaseTimer = window.setInterval(function() {
                phase = (phase + 1) % page.phases.length;
                label.innerText = page.phases[phase];
            }, 4000);
        }

        function stopBreathing() {
            var page = copy[state.lang].pages[state.page] || copy[state.lang].pages[2];
            var button = byId("breathe-btn");
            var wrap = byId("breathe-wrap");
            if (breatheAnimation) {
                breatheAnimation.cancel();
                breatheAnimation = null;
            }
            if (breathePhaseTimer) {
                window.clearInterval(breathePhaseTimer);
                breathePhaseTimer = null;
            }
            if (button && page.start) {
                button.innerText = page.start;
            }
            if (wrap) {
                wrap.style.display = "none";
            }
        }

        function resetVentInput(input) {
            input.value = "";
            input.classList.remove("becoming-bubble");
            input.removeAttribute("readonly");
            [
                "transition",
                "transform",
                "opacity",
                "filter",
                "width",
                "height",
                "padding",
                "color",
                "background",
                "border",
                "border-color",
                "border-radius",
                "box-shadow",
                "margin"
            ].forEach(function(property) {
                input.style.removeProperty(property);
            });
        }

        function clearVent(event) {
            var page = copy[state.lang].pages[3];
            var input = byId("v-text");
            var status = byId("vent-status");
            var button = event && event.currentTarget ? event.currentTarget : null;
            if (!input || input.value.trim() === "") {
                if (status) status.innerText = page.empty;
                return;
            }
            if (event) {
                popParticles(event);
            }
            if (status) status.innerText = "";
            if (button) button.disabled = true;
            input.setAttribute("readonly", "readonly");
            input.classList.remove("becoming-bubble");
            void input.offsetWidth;
            input.classList.add("becoming-bubble");
            trackGaEvent("vent_release");
            window.setTimeout(function() {
                resetVentInput(input);
                if (button) button.disabled = false;
                if (status) status.innerText = page.released;
            }, 1600);
        }

        async function submitJoy(event) {
            var page = copy[state.lang].pages[4];
            var input = byId("joy-text");
            var status = byId("joy-status");
            var text = input ? input.value.trim().replace(/\s+/g, " ") : "";
            if (text.length < 3 || text.length > 220) {
                if (status) status.innerText = page.empty;
                return;
            }
            if (event) {
                popParticles(event);
            }
            if (status) status.innerText = page.saving;
            lastSubmittedJoy = text;
            try {
                var response = await fetch("/api/oasis/joy", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ lang: state.lang, text: text })
                });
                if (!response.ok) {
                    throw new Error("save failed");
                }
                if (input) input.value = "";
                if (status) status.innerText = page.saved;
                trackGaEvent("joy_submit_success");
                await triggerSwap(null, text);
            } catch (error) {
                if (input) input.value = "";
                if (status) status.innerText = page.failed;
                showJoy(randomItem(joyFallbacks[state.lang].filter(function(item) { return item !== text; })));
            }
        }

        async function triggerSwap(event, avoidText) {
            var page = copy[state.lang].pages[4];
            if (event) {
                popParticles(event);
            }
            try {
                var response = await fetch("/api/oasis/joy?lang=" + encodeURIComponent(state.lang) + "&_=" + Date.now());
                if (!response.ok) {
                    throw new Error("fetch failed");
                }
                var data = await response.json();
                var text = data.text || "";
                if (!text || text === avoidText || text === lastSubmittedJoy) {
                    text = randomItem(joyFallbacks[state.lang].filter(function(item) { return item !== avoidText && item !== lastSubmittedJoy; }));
                }
                showJoy(text);
            } catch (error) {
                if (byId("joy-status")) byId("joy-status").innerText = page.failed;
                showJoy(randomItem(joyFallbacks[state.lang]));
            }
        }

        function showJoy(text) {
            var box = byId("j-box");
            if (!box) {
                return;
            }
            box.style.opacity = "0";
            box.style.transition = "opacity 0.24s ease";
            window.setTimeout(function() {
                lastJoyText = text;
                box.innerText = quoteText(text);
                box.style.opacity = "1";
                ensureJoyPosterButton();
            }, 180);
        }

        function ensureJoyPosterButton() {
            var actions = document.querySelector(".joy-actions");
            if (!actions || byId("joy-poster-btn")) {
                return;
            }
            var button = document.createElement("button");
            button.className = "happy-btn soft-link-btn";
            button.id = "joy-poster-btn";
            button.type = "button";
            button.innerText = copy[state.lang].share.poster;
            button.onclick = function(event) {
                createHealingPoster(event, "joy");
            };
            actions.appendChild(button);
            var preview = byId("poster-preview");
            if (!preview) {
                preview = document.createElement("div");
                preview.className = "poster-preview";
                preview.id = "poster-preview";
                var status = byId("joy-status");
                if (status && status.parentNode) {
                    status.parentNode.insertBefore(preview, status.nextSibling);
                }
            }
        }

        function popParticles(event) {
            var x = event && event.clientX ? event.clientX : window.innerWidth / 2;
            var y = event && event.clientY ? event.clientY : window.innerHeight / 2;
            for (var i = 0; i < 10; i += 1) {
                var dot = document.createElement("span");
                dot.innerText = "✦";
                dot.style.position = "fixed";
                dot.style.left = x + "px";
                dot.style.top = y + "px";
                dot.style.zIndex = "99";
                dot.style.pointerEvents = "none";
                dot.style.color = i % 2 ? "#FAD0C4" : "#FCD34D";
                dot.style.fontSize = 10 + Math.random() * 8 + "px";
                dot.style.opacity = "0.9";
                dot.style.transform = "translate(-50%, -50%) scale(1)";
                dot.style.transition = "transform 760ms ease, opacity 760ms ease";
                document.body.appendChild(dot);
                (function(node) {
                    var angle = Math.random() * Math.PI * 2;
                    var distance = 34 + Math.random() * 54;
                    window.requestAnimationFrame(function() {
                        node.style.transform = "translate(" + Math.cos(angle) * distance + "px, " + Math.sin(angle) * distance + "px) scale(0.3)";
                        node.style.opacity = "0";
                    });
                    window.setTimeout(function() {
                        node.remove();
                    }, 820);
                })(dot);
            }
        }

        window.addEventListener("popstate", function() {
            readInitialState();
            stopAllAudio();
            stopBreathing();
            syncShell();
            renderPage();
        });

        document.addEventListener("DOMContentLoaded", function() {
            recordLocalVisit();
            readInitialState();
            syncShell();
            goToPage(state.page, true);
        });
    </script>
